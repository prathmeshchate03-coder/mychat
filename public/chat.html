<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JenChat - Chat rooms</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css"></head><body>
<div id="gate" style="max-width:400px;margin:40px auto;padding:20px;background:var(--bg2);border-radius:12px">
  <a class="brand" href="/" style="justify-content:center"><img src="/logo.svg" alt="">Jen<span>Chat</span></a>
  <p>Free guest chat or Register/Login for permanent ID & Image Sharing.</p>
  
  <div id="guestLogin">
    <input type="text" id="nick" maxlength="20" placeholder="Pick a nickname" aria-label="Nickname"><br><br>
    <label><input type="checkbox" id="age"> I am 18 or older and will be respectful</label><br><br>
    <button id="go">Enter as Guest</button>
    <hr style="margin:20px 0;border-color:var(--mut)">
    <button id="showReg" class="ghost">Register with Email</button>
    <button id="showLogin" class="ghost" style="margin-top:8px">Already have an account? Login</button>
  </div>

  <div id="authBox" hidden>
    <h3 id="authTitle" style="margin-bottom:10px">Register Account</h3>
    <input type="text" id="regName" placeholder="Full Name" maxlength="20" style="margin-bottom:10px"><br>
    <input type="email" id="regEmail" placeholder="Email Address" style="margin-bottom:10px"><br>
    <input type="password" id="regPass" placeholder="Password (min 6 chars)" style="margin-bottom:10px"><br>
    <div id="verifyDiv" hidden style="margin-bottom:10px">
      <input type="text" id="verifyCode" placeholder="Enter 6-digit verification code">
      <button id="verifyBtn" style="margin-top:5px">Verify Email</button>
    </div>
    <button id="authSubmit">Register</button>
    <button id="backGuest" class="ghost" style="margin-top:8px">Back</button>
  </div>

  <div id="loginBox" hidden>
    <h3 style="margin-bottom:10px">Account Login</h3>
    <input type="email" id="loginEmail" placeholder="Email Address" style="margin-bottom:10px"><br>
    <input type="password" id="loginPass" placeholder="Password" style="margin-bottom:10px"><br>
    <button id="loginSubmit">Login</button>
    <button id="backGuestFromLogin" class="ghost" style="margin-top:8px">Back</button>
  </div>
</div>

<div id="app" hidden><aside id="side">
<div style="display:flex; justify-content:space-between; align-items:center;">
  <a class="brand" href="/" style="font-size:18px"><img src="/logo.svg" alt="" style="width:28px;height:28px">Jen<span>Chat</span></a>
  <button id="logoutBtn" class="ghost sm" style="color:#ff5555" hidden>Logout</button>
</div>
<input type="text" id="q" placeholder="Search rooms" aria-label="Search rooms"><div id="list"></div>
<b>Topics</b><div class="chips" id="chips"></div>
<input type="text" id="newroom" placeholder="Join or create room" maxlength="30"><button id="joinbtn">Join</button>
<button id="priv" class="ghost">Create private room</button></aside>
<div id="main"><div id="head"><button id="menu" class="ghost" aria-label="Rooms">Rooms</button><b id="rname"></b><button id="dmbtn" class="ghost" aria-expanded="false" aria-controls="dms">Messages<span id="dmbadge" hidden></span></button><button id="cnt" class="ghost" aria-expanded="false" aria-controls="users" hidden></button></div>
<div id="users" hidden></div>
<div id="dms" hidden></div>
<div id="msgs" aria-live="polite"></div>
<div id="typing" aria-live="polite"></div>
<div id="emojis" hidden></div>
<div id="form">
  <button id="emo" class="ghost" aria-label="Emoji" aria-expanded="false">&#128578;</button>
  <label for="imgUpload" id="imgLabel" class="ghost" style="padding: 8px 12px; cursor: pointer; display: flex; align-items: center;" title="Send Image">&#128247;</label>
  <input type="file" id="imgUpload" accept="image/*" hidden>
  <input type="text" id="text" maxlength="500" placeholder="Type a message" autocomplete="off" aria-label="Message">
  <button id="send">Send</button>
</div></div></div>

<div id="imgModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:99; justify-content:center; align-items:center; cursor:pointer;" onclick="this.style.display='none'">
  <img id="modalImg" style="max-width:90vw; max-height:90vh; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
</div>

<script>
const $ = id => document.getElementById(id);
let nick = localStorage.nick, room, es, otok = '', currentUser = null, isRegistered = false;

// Check session on load
fetch('/auth/me').then(r => r.json()).then(d => {
  if(d.loggedIn){ currentUser = d; isRegistered = true; startChat(d.name); }
}).catch(()=>{});

$('showReg').onclick = () => {$('guestLogin').hidden = true; $('authBox').hidden = false; $('loginBox').hidden = true; };
$('showLogin').onclick = () => {$('guestLogin').hidden = true; $('authBox').hidden = true; $('loginBox').hidden = false; };
$('backGuest').onclick = () => {$('authBox').hidden = true; $('guestLogin').hidden = false; };$('backGuestFromLogin').onclick = () => { $('loginBox').hidden = true; $('guestLogin').hidden = false; };

let regMode = 'register';
$('authSubmit').onclick = async () => {
  const name = $('regName').value.trim(), email = $('regEmail').value.trim(), password =$('regPass').value.trim();
  if(!email || !password) return alert('Enter email and password');
  
  if(regMode === 'register'){
    const res = await fetch('/auth/register', { method: 'POST', body: JSON.stringify({ name, email, password }) });
    const j = await res.json();
    if(res.ok){
      alert('Verification code sent! (Check server console debugCode: ' + j.debugCode + ')');
      $('verifyDiv').hidden = false;
      $('authTitle').textContent = 'Verify Email';$('authSubmit').textContent = 'Login after Verify';
      regMode = 'verify';
    } else { alert(j.error); }
  } else if(regMode === 'verify'){
    const code = $('verifyCode').value.trim();
    const vRes = await fetch('/auth/verify', { method: 'POST', body: JSON.stringify({ email, code }) });
    const vj = await vRes.json();
    if(vRes.ok){
      const lRes = await fetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      const lj = await lRes.json();
      if(lj.ok){ currentUser = lj; isRegistered = true; startChat(lj.name); }
      else alert(lj.error);
    } else alert(vj.error);
  }
};

$('loginSubmit').onclick = async () => {
  const email = $('loginEmail').value.trim(), password =$('loginPass').value.trim();
  if(!email || !password) return alert('Enter email and password');
  const res = await fetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  const j = await res.json();
  if(res.ok){
    currentUser = j; isRegistered = true; startChat(j.name);
  } else {
    alert(j.error || 'Login failed');
  }
};

// Logout Handler
$('logoutBtn').onclick = async () => {
  await fetch('/auth/logout', { method: 'POST' });
  currentUser = null;
  isRegistered = false;
  location.reload();
};

$('go').onclick = () => {
  if(!$('age').checked) return alert('Please confirm you are 18 or older');
  nick = $('nick').value.trim().slice(0, 20) || 'Guest';
  localStorage.nick = nick;
  startChat(nick);
};

function startChat(name){
  nick = name;
  $('gate').hidden = true;
  $('app').hidden = false;
  if(currentUser) $('logoutBtn').hidden = false; // Show logout button for registered users
  join(location.hash.slice(1) || 'lobby');
  loadRooms();
  setInterval(loadRooms, 5000);
}

function join(name){
  room = name; location.hash = name; $('rname').textContent = '#' + name; $('msgs').innerHTML = '';
  if(es) es.close();
  es = new EventSource('/events?room=' + name + '&nick=' + encodeURIComponent(nick));
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if(d.history){ $('msgs').innerHTML = ''; d.history.forEach(add); }
    else if(d.imgdel){
      const elMsg = document.querySelector(`[data-id="${d.imgdel}"]`);
      if(elMsg){ elMsg.querySelector('.msg-body').textContent = '[Image deleted by user]'; const img = elMsg.querySelector('img'); if(img) img.remove(); const delBtn = elMsg.querySelector('.del-btn'); if(delBtn) delBtn.remove(); }
    }
    else add(d);
  };
}

function add(m){
  const box = $('msgs');
  if(m.system){ box.append(el('div', m.text, 'sys')); box.scrollTop = box.scrollHeight; return; }
  
  const mine = currentUser ? m.userId === currentUser.id : m.nick === nick;
  const d = el('div', '', 'm' + (mine ? ' me' : ''));
  d.dataset.id = m.id;
  
  const b = el('b', m.nick); d.append(b);
  
  const rp = el('a', 'report'); rp.onclick = () => fetch('/report', { method: 'POST', body: JSON.stringify({ room, id: m.id }) });
  d.append(rp);

  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'msg-body';
  
  if(m.isImage){
    const img = document.createElement('img');
    img.src = m.text;
    img.style.maxWidth = '200px'; img.style.maxHeight = '200px'; img.style.objectFit = 'cover';
    img.style.borderRadius = '8px'; img.style.display = 'block'; img.style.cursor = 'pointer';
    img.onclick = () => openModal(m.text);
    bodyDiv.append(img);
  } else {
    bodyDiv.textContent = m.text;
  }
  d.append(bodyDiv);

  if(currentUser && m.userId === currentUser.id && !m.deleted){
    const delBtn = el('button', 'Delete', 'ghost sm del-btn');
    delBtn.style.marginLeft = '10px';
    delBtn.onclick = () => fetch('/img/delete', { method: 'POST', body: JSON.stringify({ msgId: m.id }) });
    d.append(delBtn);
  }

  box.append(d); box.scrollTop = box.scrollHeight;
}

$('imgUpload').onchange = (e) => {
  if(!currentUser){
    alert('Images sirf registered aur verified users hi share kar sakte hain. Please register/login karein.');
    return;
  }
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 1500000) { alert('Image size 1.5MB se kam honi chahiye.'); return; }
  const reader = new FileReader();
  reader.onload = (uploadEvent) => {
    fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room, nick, text: uploadEvent.target.result, isImage: true })
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

function send(){
  const t = $('text').value.trim(); if(!t) return; $('text').value = '';
  fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room, nick, text: t }) });
}
$('send').onclick = send;
$('text').onkeydown = e => { if(e.key === 'Enter') send(); };

$('joinbtn').onclick = () => { join($('newroom').value);$('newroom').value = ''; };
$('priv').onclick = () => { const name = 'p-' + [...crypto.getRandomValues(new Uint8Array(6))].map(x => x.toString(16).padStart(2, '0')).join(''); join(name); };$('menu').onclick = () => $('side').classList.toggle('open');$('q').oninput = loadRooms;

async function loadRooms(){
  try {
    const l = await (await fetch('/rooms?q=' + encodeURIComponent($('q').value))).json();$('list').innerHTML = '';
    if(!l.length){ $('list').textContent = 'No rooms'; return; }
    l.forEach(r => { const d = el('div', '', 'room'); d.textContent = '#' + r.name; d.onclick = () => join(r.name); $('list').append(d); });
  } catch {}
}

function openModal(src){ $('modalImg').src = src; $('imgModal').style.display = 'flex'; }
function el(tag, txt, cls){ const e = document.createElement(tag); if(txt) e.textContent = txt; if(cls) e.className = cls; return e; }
</script></body></html>
