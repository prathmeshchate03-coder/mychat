<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JenChat Admin</title><link rel="stylesheet" href="/style.css">
<style>
body { padding: 20px; max-width: 800px; margin: 0 auto; }
.card { background: var(--bg2, #1f2533); border: 1px solid var(--line, #34343c); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
.item { padding: 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
</style>
</head><body>
<a class="brand" href="/"><img src="/logo.svg" alt="">Jen<span>Chat Admin</span></a>

<div id="loginSection" class="card" style="margin-top:20px">
  <h3>Admin Access</h3><br>
  <input type="password" id="adminToken" placeholder="Enter ADMIN_TOKEN (default: admin123)" style="margin-bottom:10px;width:100%"><br>
  <button id="loginBtn">Login to Admin</button>
</div>

<div id="dashSection" hidden style="margin-top:20px">
  <button id="logoutAdmin" class="ghost sm" style="float:right;color:#ff4949">Log out</button>
  <h2>Live Dashboard</h2>
  
  <div class="card">
    <h3>Open Reports (<span id="repCount">0</span>)</h3>
    <div id="reportsList">No reports yet</div>
  </div>

  <div class="card">
    <h3>Live Rooms (<span id="roomCount">0</span>)</h3>
    <div id="roomsList">No active rooms</div>
  </div>

  <div class="card">
    <h3>Close Room</h3>
    <input type="text" id="closeRoomName" placeholder="Room name (e.g. lobby)">
    <button id="closeRoomBtn" style="margin-top:5px">Close Room</button>
  </div>

  <div class="card">
    <h3>Ban IP (24 Hours)</h3>
    <input type="text" id="banIpAddr" placeholder="IP Address">
    <button id="banIpBtn" style="margin-top:5px">Ban IP</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.adminToken || 'admin123';

function loadAdminData() {
  fetch('/admin/data', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(r => {
    if(r.status === 401) {
      $('loginSection').hidden = false;
      $('dashSection').hidden = true;
      return null;
    }
    return r.json();
  }).then(d => {
    if(!d) return;
    $('loginSection').hidden = true;
    $('dashSection').hidden = false;

    // Reports
    $('repCount').textContent = d.reports.length;
    if(d.reports.length) {
      $('reportsList').innerHTML = d.reports.map(r => `
        <div class="item">
          <div>
            <b>#${r.room}</b> - <i>${r.nick}</i> (${r.ip})<br>
            <span>"${r.text}"</span>
          </div>
          <button onclick="banIp('${r.ip}')" class="ghost sm" style="color:#ff4949">Ban IP</button>
        </div>
      `).join('');
    } else $('reportsList').textContent = 'No active reports';

    // Rooms
    $('roomCount').textContent = d.rooms.length;
    if(d.rooms.length) {
      $('roomsList').innerHTML = d.rooms.map(r => `
        <div class="item">
          <div><b>#${r.name}</b> (${r.count} users online) - Users: ${r.users.join(', ')}</div>
          <button onclick="closeRoom('${r.name}')" class="ghost sm">Close</button>
        </div>
      `).join('');
    } else $('roomsList').textContent = 'No active rooms';
  });
}

$('loginBtn').onclick = () => {
  token = $('adminToken').value.trim();
  localStorage.adminToken = token;
  loadAdminData();
};

$('logoutAdmin').onclick = () => {
  localStorage.removeItem('adminToken');
  location.reload();
};

function closeRoom(name) {
  fetch('/admin/close', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ room: name })
  }).then(() => loadAdminData());
}

function banIp(ip) {
  fetch('/admin/ban', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ ip })
  }).then(() => { alert('IP Banned'); loadAdminData(); });
}

$('closeRoomBtn').onclick = () => closeRoom($('closeRoomName').value.trim());
$('banIpBtn').onclick = () => banIp($('banIpAddr').value.trim());

loadAdminData();
setInterval(loadAdminData, 3000); // Auto refresh every 3s
</script>
</body></html>
