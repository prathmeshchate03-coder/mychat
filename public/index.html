<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JenChat - Secure Chat & Social Portal</title>
  <meta name="description" content="Register or enter instantly. Create free private chat rooms, add global friends, and pick cool profile avatars.">
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-container { max-width: 400px; margin: 50px auto; padding: 25px; border: 1px solid #444; border-radius: 8px; background: #222; box-shadow: 0 4px 10px rgba(0,0,0,0.3); color: #fff; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; background: #444; color: #bbb; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #fff; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #555; border-radius: 4px; background: #fff; color: #000; font-size: 15px; font-weight: 500; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px; }
    .avatar-option { font-size: 24px; text-align: center; cursor: pointer; padding: 5px; border: 2px solid transparent; border-radius: 4px; }
    .avatar-option.selected { border-color: #007bff; background: #444; }
    .submit-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .submit-btn:hover { background: #218838; }
    .guest-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <header style="text-align: center; margin-top: 30px;">
    <h1>Welcome to JenChat ✨</h1>
    <p>Connect securely, pick your avatar, and add friends globally</p>
  </header>

  <div class="auth-container">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="auth-form-box">
      <!-- Dynamic Form Content injected here -->
    </div>
  </div>

  <script>
    let activeTab = 'login';
    let selectedAvatar = '🐱';

    function switchTab(type) {
      activeTab = type;
      document.getElementById('tab-login').className = type === 'login' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-register').className = type === 'register' ? 'tab-btn active' : 'tab-btn';
      renderForm();
    }

    function selectAvatar(emoji) {
      selectedAvatar = emoji;
      document.querySelectorAll('.avatar-option').forEach(el => {
        el.className = el.innerText === emoji ? 'avatar-option selected' : 'avatar-option';
      });
    }

    function renderForm() {
      const box = document.getElementById('auth-form-box');
      if (activeTab === 'login') {
        box.innerHTML = `
          <form onsubmit="handleAuth(event)">
            <div class="form-group"><label>Username</label><input type="text" id="username" required autocomplete="username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div>
            <button type="submit" class="submit-btn">Sign In</button>
          </form>
        `;
      } else {
        box.innerHTML = `
          <form onsubmit="handleAuth(event)">
            <div class="form-group"><label>Choose Username</label><input type="text" id="username" required autocomplete="username"></div>
            <div class="form-group"><label>Create Password</label><input type="password" id="password" required autocomplete="new-password"></div>
            <div class="form-group">
              <label>Select Profile Avatar</label>
              <div class="avatar-grid">
                <div class="avatar-option selected" onclick="selectAvatar('🐱')">🐱</div>
                <div class="avatar-option" onclick="selectAvatar('🦊')">🦊</div>
                <div class="avatar-option" onclick="selectAvatar('🤖')">🤖</div>
                <div class="avatar-option" onclick="selectAvatar('🥷')">🥷</div>
                <div class="avatar-option" onclick="selectAvatar('🐼')">🐼</div>
                <div class="avatar-option" onclick="selectAvatar('🦁')">🦁</div>
                <div class="avatar-option" onclick="selectAvatar('👽')">👽</div>
                <div class="avatar-option" onclick="selectAvatar('🦄')">🦄</div>
              </div>
            </div>
            <button type="submit" class="submit-btn">Create Free Account</button>
          </form>
        `;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const endpoint = activeTab === 'login' ? '/api/login' : '/api/register';
      const payload = { username: u, password: p };
      
      if (activeTab === 'register') payload.avatar = selectedAvatar;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.ok) {
          // Store basic profile credentials locally
          localStorage.setItem('chat_token', data.token);
          localStorage.setItem('chat_nick', data.username);
          localStorage.setItem('chat_avatar', data.avatar);
          
          // Redirect to dynamic lobby or default global room
          window.location.href = `/chat?room=global&nick=${encodeURIComponent(data.username)}&avatar=${encodeURIComponent(data.avatar)}`;
        } else {
          alert(data.error || 'Authentication Failed!');
        }
      } catch(err) {
        alert('Server connection error. Try again.');
      }
    }

    // Load form initial call
    renderForm();
  </script>
</body>
</html>
